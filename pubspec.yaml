name: todo_list_and_clock
description: "Todo List & Clock - 待办清单与专注计时器 (MVVM)"
publish_to: 'none'
version: 0.3.0-mvvm

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  path: ^1.9.1
  shared_preferences: ^2.5.4
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.7+1
  provider: ^6.1.2
  fl_chart: ^0.68.0
  audioplayers: ^6.6.0
  dynamic_color: ^1.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/music/songs.json
    - assets/music/
    - assets/images/

  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/Noto-Sans-SC.ttf
        - asset: assets/fonts/Noto-Sans-SC-Bold.ttf
          weight: 700
